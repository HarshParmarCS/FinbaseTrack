# Finbase Workdesk: the whole application with one command, from the repository root:
#
#   docker compose up --build          # foreground (Ctrl+C stops it)
#   docker compose up --build -d       # background
#
# Works with Docker Compose and with Podman (`podman compose up --build`).
#
# Three long-running containers on one private network:
#   postgres  PostgreSQL 16, data in the named volume `fintasks_pgdata`
#   backend   FastAPI; applies Alembic migrations, then serves the API on :8000
#   frontend  Next.js on :3000; forwards /api/* to the backend over the internal network
#
# Configuration comes from the root `.env` file (copy `.env.example`). Nothing secret is written
# here. `docker compose down` keeps the database; `docker compose down -v` DELETES it.

services:
  postgres:
    # Fully qualified name: Podman does not guess the registry.
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fintasks}
    ports:
      # Published on the loopback interface only, for local tools (psql, the backend test suite).
      # The backend reaches the database over the internal network as postgres:5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Same volume name as before the full-stack setup, so existing local data is kept.
      - fintasks_pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created: also creates `<db>_test` for the test suite.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [workdesk]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Internal service name and port, never localhost. Use a URL-safe password (hex works).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fintasks}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (at least 32 characters)}
      JWT_ISSUER: ${JWT_ISSUER:-fintasks-api}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # The browser origin (the frontend URL). Used by CORS and by the CSRF Origin check.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [workdesk]

  frontend:
    build:
      context: ./frontend
      args:
        # Server-side target of the /api/* rewrite (internal hostname, baked in at build time).
        BACKEND_INTERNAL_URL: http://backend:8000
        # Browser-side API base. Empty = same origin through the frontend (recommended).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Finbase Workdesk}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [workdesk]

networks:
  workdesk:

volumes:
  fintasks_pgdata:
