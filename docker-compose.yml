# FinTasks local infrastructure. Works with Podman (`podman compose`) and Docker (`docker compose`).
# Currently only the database. Backend and frontend services are added in milestones M8 and M13.
#
# Usage (from the repository root):
#   podman compose up -d db      # start PostgreSQL
#   podman compose down          # stop (data is kept in the named volume)
#   podman compose down -v       # stop AND delete all database data
#
# Credentials come from the root `.env` file (see `.env.example`). Nothing is hardcoded here.

services:
  db:
    # Fully qualified name: Podman does not guess the registry.
    image: docker.io/library/postgres:16
    container_name: fintasks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fintasks}
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL already installed on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fintasks_pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created: creates the `<db>_test` database.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fintasks_pgdata:
